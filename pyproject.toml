[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "action-sentinel"
version = "0.2.0"
description = "VegaML-powered safety checkpoint for AI agent actions: model risk judgement under deterministic governance."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Prem Kumar" }]
keywords = ["ai-agents", "agent-safety", "guardrails", "governance", "human-in-the-loop", "vegaml", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/premm25/action-sentinel"
Documentation = "https://github.com/premm25/action-sentinel/tree/main/docs"
Changelog = "https://github.com/premm25/action-sentinel/blob/main/CHANGELOG.md"
Issues = "https://github.com/premm25/action-sentinel/issues"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dashboard = ["streamlit>=1.35", "pandas>=2.0"]
# VegaML is optional and heavy (torch + transformers + model weights). Sentinel works without it.
# Pinned to the tested series: the integration uses vegaml internals, and every result was measured on 0.9.0.
vegaml = ["vegaml>=0.9,<0.10"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "fastapi>=0.110", "uvicorn>=0.27", "streamlit>=1.35"]

[project.scripts]
action-sentinel = "action_sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["action_sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ollama: requires a running local Ollama server with the configured model (optional)",
  "vegaml: requires the vegaml package and model weights (optional)",
]
addopts = "-m 'not ollama and not vegaml'"

[tool.coverage.run]
source = ["action_sentinel"]

[tool.ruff]
line-length = 125

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# notebook cells hold single-line shell commands that must not be wrapped
"scripts/build_kaggle_notebook.py" = ["E501"]
