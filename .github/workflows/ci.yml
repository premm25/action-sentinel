name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev,dashboard]"
      - name: Lint
        run: ruff check action_sentinel tests scripts
      - name: Dataset is reproducible
        run: |
          python scripts/build_dataset.py
          git diff --exit-code examples/evaluation_datasets/
      - name: Tests with coverage
        run: pytest --cov=action_sentinel --cov-report=term --cov-report=xml
      - name: Offline end-to-end demo
        run: action-sentinel demo --quiet
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
